name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Test example module
        working-directory: example
        env:
          CGO_ENABLED: 1
        run: go test ./...

  integration:
    name: Integration (${{ matrix.database }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MySQL
            driver: mysql
            dsn: root:123456@tcp(127.0.0.1:3306)/test?parseTime=true&charset=utf8mb4&collation=utf8mb4_general_ci&loc=Local
          - database: PostgreSQL
            driver: pgx
            dsn: host=127.0.0.1 user=postgres password=123456 dbname=test port=5432 sslmode=disable TimeZone=Asia/Shanghai
          - database: SQLite
            driver: sqlite3
            dsn: file:test.db?cache=shared&mode=memory
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      - name: Download dependencies
        working-directory: integration
        run: go mod download

      - name: Run integration tests
        working-directory: integration
        env:
          CGO_ENABLED: 1
          DB_DRIVER: ${{ matrix.driver }}
          DB_DSN: ${{ matrix.dsn }}
        run: go test -count=1 -v ./...
